appId: com.clarus.desktop
productName: Clarus
# asar disabled on purpose: the agent runs as a child Node process (Electron-as-
# Node) that resolves pi + loads native deps from node_modules; keeping the tree
# on real disk avoids the asar/asar.unpacked path + native-module pitfalls.
asar: false

directories:
  buildResources: build
  output: release

# Default artifact name (mac overrides keep Clarus.dmg / Clarus.zip for stable
# /releases/latest/download/ URLs). Windows uses nsis/portable artifactName
# below so Setup vs Portable do not collide on the same .exe extension.
artifactName: ${productName}.${ext}

# CI publishes the release artifacts via `electron-builder --publish always`,
# which uploads to the GitHub Release for the current tag. publishAutoUpdate
# (default true) also uploads latest-mac.yml — the electron-updater feed — and
# embeds app-update.yml in the app. Stable clients never see rc feeds: the
# GitHub provider skips semver-prerelease tags, and release.yml marks rc
# releases --prerelease. NOTE: if a second arch (x64) is ever re-added as a
# separate matrix job, both jobs would upload the SAME-named latest-mac.yml to
# one release and can 422 each other — build both arches in one job or use
# per-arch channel files then.
# Publish target remains the upstream fork host until Clarus has its own release
# repo; update owner/repo when the firm distribution channel is ready.
publish:
  provider: github
  owner: machulav
  repo: accountant24

# out/ (electron-vite build) + the app manifest. electron-builder also bundles
# the production dependencies (pi SDK, react, …) automatically.
files:
  - out/**/*
  - package.json
  - "!**/*.{map,md}"

# Vendored, on-disk resources the agent child reads via env (PATH / TESSDATA_PREFIX)
# and `pi -e`. Land under Contents/Resources/ → matches env.ts resourceDir().
extraResources:
  - from: resources/bin
    to: bin
  - from: resources/tessdata
    to: tessdata
  - from: resources/clarus-extension.js
    to: clarus-extension.js
  # Third-party license notice for the bundled GPL/permissive CLI tools
  # (generated by scripts/vendor-bin.ts).
  - from: resources/THIRD-PARTY-LICENSES.txt
    to: THIRD-PARTY-LICENSES.txt

mac:
  # arm64 only: the arch list here overrides CLI --arm64/--x64 flags, and the
  # vendored CLI tools (resources/bin) are built for the host arch — an x64 app
  # with arm64 tools inside would not work on Intel. See release.yml for why
  # Intel builds are dropped and what re-adding them would take.
  # Keep mac artifact names versionless (Clarus.dmg / Clarus.zip) for stable
  # /latest/download URLs — see top-level artifactName.
  artifactName: ${productName}.${ext}
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.finance
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Developer-ID signing + notarization run in CI only, driven by env:
  # CSC_LINK / CSC_KEY_PASSWORD select the cert, and APPLE_API_KEY /
  # APPLE_API_KEY_ID / APPLE_API_ISSUER feed notarytool (see release.yml).
  # Local builds have none of these set → ad-hoc signed, notarization skipped.
  notarize: true

# Windows pilot (unsigned OK for internal firm builds). Vendored CLI tools under
# resources/bin must be the Windows builds produced by `VENDOR_TARGET=win32`
# scripts/vendor-bin.ts — do not mix mac dylibs into a Windows package.
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # electron-builder converts PNG → multi-size ICO when .ico is absent.
  icon: build/icon.png
  # Pilot builds are unsigned: set CSC_IDENTITY_AUTO_DISCOVERY=false in CI / dist
  # env (see windows-build.yml). Do not set signAndEditExecutable=false — that also
  # skips icon/metadata rcedit; use env-based signing skip instead.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName}-Setup.${ext}

portable:
  artifactName: ${productName}-Portable.${ext}
